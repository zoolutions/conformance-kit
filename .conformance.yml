# conformance-kit's own settings: the kit obeys the tiers it enforces.
# `bundle exec exe/conformance-kit check` runs what the org-required
# conformance.yml workflow runs.
audit:
  require:
    - ./lib/conformance_kit/audit
    - ./lib/conformance_kit/cli
    - ./lib/conformance_kit/rspec
    - ./lib/conformance_kit/minitest
  namespace: [ConformanceKit]
  strict_autoloads: true
ractor:
  test_command: bundle exec rspec --tag ractor
probes:
  gem_name: conformance-kit
main_only:
  - name: ConformanceKit::Store.@fallback_lock
    reason: the below-3.4 fallback's lock, created at load and only read on the main Ractor (non-main Ractors use Ractor-local storage; 3.4+ uses Ractor.store_if_absent)
  - name: ConformanceKit::Store.@fallback_values
    reason: the below-3.4 fallback's storage, only touched on the main Ractor under @fallback_lock; never read on 3.4+
