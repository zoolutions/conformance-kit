name: Ractor canary

# Reusable Tier 3 gate (conformance-kit). On Ruby 4.0: the Ractor examples
# (`rspec --tag ractor` by default), then `conformance-audit --strict` against
# the gem's .conformance.yml. In a consuming gem:
#
#   jobs:
#     ractor:
#       uses: zoolutions/conformance-kit/.github/workflows/ractor.yml@main
#       with:
#         require: ./lib/my_gem
#         namespace: MyGem
#
# `require` and `namespace` take space-separated lists.

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby to run on (Ractor#value needs 4.0+)
        type: string
        default: "4.0"
      require:
        description: Files conformance-audit requires to boot the gem (space-separated)
        type: string
        required: true
      namespace:
        description: Constants to audit (space-separated)
        type: string
        required: true
      allowlist:
        description: The main_only allowlist (skipped when the default file is absent)
        type: string
        default: .conformance.yml
      test-command:
        description: Runs the Ractor examples (Minitest gems pass their own)
        type: string
        default: bundle exec rspec --tag ractor
      audit:
        description: Run conformance-audit --strict after the examples
        type: boolean
        default: true
      working-directory:
        description: Directory holding the gem's Gemfile
        type: string
        default: .

permissions:
  contents: read

jobs:
  ractor:
    name: Ractor canary (Ruby ${{ inputs.ruby-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}

      - name: Ractor examples
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

      - name: conformance-audit --strict
        if: inputs.audit
        env:
          REQUIRES: ${{ inputs.require }}
          NAMESPACES: ${{ inputs.namespace }}
          ALLOWLIST: ${{ inputs.allowlist }}
        run: |
          args=(--strict)
          for file in $REQUIRES; do args+=(--require "$file"); done
          for namespace in $NAMESPACES; do args+=(--namespace "$namespace"); done
          if [ -f "$ALLOWLIST" ] || [ "$ALLOWLIST" != ".conformance.yml" ]; then
            args+=(--allowlist "$ALLOWLIST")
          fi
          bundle exec conformance-audit "${args[@]}"
