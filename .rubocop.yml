# The kit lints itself with the Tier 1 config it ships (and `conformance-kit doctor` checks for).
inherit_gem:
  conformance-kit: config/rubocop.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    # The zoolutions release kit, byte-identical across the gems: never restyle it here.
    - "rakelib/release.rake"
    - "bin/release"
    - "bin/labels"
    # Consumer-shaped fixture projects: their .rubocop.yml is the one doctor checks for, not this repo's lint.
    - "spec/fixtures/projects/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# spec/fixtures/ violate the tiers ON PURPOSE: each check must be seen failing
# on a violating fixture (AGENTS.md, Testing).
ThreadSafety:
  Exclude:
    - "spec/fixtures/**/*"

# Store.fetch requires its block (it is the per-Ractor initializer), so the
# cop's `fetch(key, default)` suggestion does not apply to it.
Style/RedundantFetchBlock:
  Exclude:
    - "spec/conformance_kit/store_spec.rb"

# The specs start threads to hammer the Store and the fixtures.
ThreadSafety/NewThread:
  Exclude:
    - "spec/**/*"

# As in phlex-reactive: method and block size are reviewed, not counted.
Metrics:
  Enabled: false
