# The violating render fixture: the ractorize job must fail its request and its audit.
ractorize:
  app: .
  requests: [/widget]
  audit_namespaces: [ViolatingRenderEngine]
main_only:
  - ancestor: Rails::Engine
    ivars: ["@called_from", "@initializers"]
    reason: Rails::Engine's own class state, set by Rails at boot on the main Ractor
